<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>登录 - 在线考试 / 题库系统</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/common :: topbar(${user})}"></header>

<main class="container narrow">
  <h1>登录</h1>
  <form id="login-form" class="form">
    <label>用户名
      <input type="text" name="username" required maxlength="20" autocomplete="username" placeholder="4~20 位字母/数字">
    </label>
    <label>密码
      <input type="password" name="password" required maxlength="32" autocomplete="current-password" placeholder="6~32 位">
    </label>
    <button type="submit">登录</button>
  </form>
  <p id="tip" class="tip"></p>
  <p class="hint">
    演示账号：teacher / 123456（教师），student01 / 123456（学生），student02 / 123456（学生）<br>
    还没有账号？<a th:href="@{/register}">注册一个学生账号</a>
  </p>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
