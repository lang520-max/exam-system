# ============================================================
#  开发环境配置 — H2 内存库，无需 Redis/RabbitMQ
#  启动方式：mvn spring-boot:run -Dspring-boot.run.profiles=dev
#  说明：Redis/RabbitMQ 功能在 dev 模式下被禁用。
#       相关功能由内存模拟版替代，不影响业务逻辑验证。
# ============================================================
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/exam_system;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      # 顺序有意义：先账号，再题库/题目/试卷（后者的 created_by 指向 teacher1）
      data-locations: classpath:data-h2.sql,classpath:data-h2-shengben.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  redis:
    enabled: false
  rabbitmq:
    enabled: false