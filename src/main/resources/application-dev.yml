# ============================================================
#  零依赖开发档：不需要安装 MySQL，用 H2 文件库直接跑起来
#  启动方式：mvn spring-boot:run -Dspring-boot.run.profiles=dev
#  数据文件落在 ./data/exam_system.mv.db，重启后数据仍在
# ============================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/exam_system;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ''
  sql:
    init:
      mode: always
      # 必须显式指定 UTF-8：H2 的 RUNSCRIPT 默认按平台字符集读脚本，
      # Windows 默认 GBK 会把中文题干与选项读成乱码
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
      encoding: UTF-8
  h2:
    console:
      # 浏览器访问 http://localhost:8080/h2-console 可直接看表数据
      enabled: true
      path: /h2-console

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.caikailang.examsystem.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.caikailang.examsystem: info
    com.caikailang.examsystem.mapper: debug
