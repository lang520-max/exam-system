<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>公共片段</title>
</head>
<body>

<!--
  顶部导航片段：所有页面通过 th:replace="~{fragments/common :: topbar(${user})}" 引入。
  菜单按角色渲染：教师看到题库/试卷/成绩，学生看到考试/成绩。
-->
<header class="topbar" th:fragment="topbar(user)">
  <a class="logo" th:href="@{/}">📝 在线考试 / 题库系统</a>
  <nav>
    <th:block th:if="${user != null and user.teacher}">
      <a th:href="@{/teacher/questions}">题库管理</a>
      <a th:href="@{/teacher/papers}">试卷管理</a>
      <a th:href="@{/teacher/paper/new}">组卷</a>
      <a th:href="@{/teacher/scores}">成绩统计</a>
    </th:block>
    <th:block th:if="${user != null and user.student}">
      <a th:href="@{/student/exams}">在线考试</a>
      <a th:href="@{/student/scores}">我的成绩</a>
    </th:block>
    <th:block th:if="${user != null}">
      <span class="who" th:text="|${user.nickname}（${user.roleText}）|">用户</span>
      <button type="button" class="link-btn" onclick="logout()">退出登录</button>
    </th:block>
    <a th:if="${user == null}" th:href="@{/login}">登录</a>
  </nav>
</header>

<!-- 页脚 -->
<footer class="container muted" th:fragment="footer" style="margin-top:0">
  <p>在线考试 / 题库系统 · Spring Boot 2.7 + MyBatis + Thymeleaf · MIT License © 蔡开浪</p>
</footer>

</body>
</html>
