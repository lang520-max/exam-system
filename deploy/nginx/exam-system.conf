# ============================================================================
#  Nginx 站点（裸机部署版）—— 反代到本机 8080
#
#  与仓库里 nginx/exam.conf（Docker 版）的差别只有 upstream 指向：
#    容器版：server app:8080        （compose 服务名）
#    裸机版：server 127.0.0.1:8080  （systemd 里的应用）
#  其余路径、WebSocket 升级、健康检查口径保持一致。
#
#  安装位置：/etc/nginx/conf.d/exam-system.conf（bootstrap.sh 自动拷贝）
# ============================================================================
upstream exam_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80 default_server;
    server_name _;
    charset utf-8;

    access_log /var/log/nginx/exam_access.log;
    error_log  /var/log/nginx/exam_error.log;

    # 只加传输层/浏览器行为的安全头，不改页面外观与布局
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # API 反向代理
    location /api/ {
        proxy_pass http://exam_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 交卷是同步判分（本机没装 RabbitMQ），含主观题的卷子判分耗时略长
        proxy_send_timeout 60s;
    }

    # WebSocket 代理（考试倒计时推送）
    location /ws/ {
        proxy_pass http://exam_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 健康检查：指向 actuator，而不是需要鉴权的 /api/auth/me
    location /health {
        proxy_pass http://exam_backend/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # 静态资源 + 页面
    location / {
        proxy_pass http://exam_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}