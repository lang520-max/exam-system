<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>题库管理 - 在线考试 / 题库系统</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/common :: topbar(${user})}"></header>

<main class="container">
  <div class="page-head">
    <h1>题库管理</h1>
    <span class="muted">共 <b th:text="${page.total}">0</b> 道题 · 当前第 <b th:text="${page.pageNum}">1</b> / <b th:text="${page.pages}">1</b> 页</span>
  </div>

  <!-- ------------------------------ 检索 ------------------------------ -->
  <div class="card">
    <form class="filters" method="get" th:action="@{/teacher/questions}">
      <label>关键字
        <input type="text" name="keyword" th:value="${query.keyword}" placeholder="匹配题干或知识点">
      </label>
      <label>科目
        <select name="subject">
          <option value="">全部科目</option>
          <option th:each="s : ${subjects}" th:value="${s}" th:text="${s}"
                  th:selected="${s == query.subject}"></option>
        </select>
      </label>
      <label>题型
        <select name="type">
          <option value="">全部题型</option>
          <option value="SINGLE" th:selected="${query.type == 'SINGLE'}">单选题</option>
          <option value="MULTIPLE" th:selected="${query.type == 'MULTIPLE'}">多选题</option>
          <option value="JUDGE" th:selected="${query.type == 'JUDGE'}">判断题</option>
        </select>
      </label>
      <label>难度
        <select name="difficulty">
          <option value="">全部难度</option>
          <option value="EASY" th:selected="${query.difficulty == 'EASY'}">简单</option>
          <option value="MEDIUM" th:selected="${query.difficulty == 'MEDIUM'}">中等</option>
          <option value="HARD" th:selected="${query.difficulty == 'HARD'}">困难</option>
        </select>
      </label>
      <label>排序
        <select name="sortBy">
          <option value="created_at" th:selected="${query.sortBy == 'created_at'}">按创建时间</option>
          <option value="score" th:selected="${query.sortBy == 'score'}">按分值</option>
          <option value="id" th:selected="${query.sortBy == 'id'}">按编号</option>
        </select>
      </label>
      <label>方向
        <select name="sortDir">
          <option value="desc" th:selected="${query.sortDir == 'desc'}">倒序</option>
          <option value="asc" th:selected="${query.sortDir == 'asc'}">正序</option>
        </select>
      </label>
      <button type="submit">检索</button>
      <a class="btn ghost" th:href="@{/teacher/questions}">重置</a>
    </form>
  </div>

  <!-- ------------------------------ 新增 / 编辑 ------------------------------ -->
  <div class="card">
    <h2 id="form-title">新增题目</h2>
    <form id="question-form" class="form">
      <input type="hidden" name="id" value="">
      <div class="form-row">
        <label>题型
          <select name="type" id="q-type">
            <option value="SINGLE">单选题</option>
            <option value="MULTIPLE">多选题</option>
            <option value="JUDGE">判断题</option>
          </select>
        </label>
        <label>科目
          <input type="text" name="subject" required maxlength="32" list="subject-options" placeholder="如：Java程序设计">
        </label>
        <label>知识点
          <input type="text" name="knowledgePoint" maxlength="64" placeholder="如：集合框架">
        </label>
        <label>难度
          <select name="difficulty">
            <option value="EASY">简单</option>
            <option value="MEDIUM" selected>中等</option>
            <option value="HARD">困难</option>
          </select>
        </label>
        <label>分值
          <input type="number" name="score" required min="0.5" max="100" step="0.5" value="5.0">
        </label>
      </div>

      <label>题干
        <textarea name="content" rows="2" required maxlength="500" placeholder="请输入题干"></textarea>
      </label>

      <div id="option-block">
        <div class="form-row">
          <label>选项 A<input type="text" name="optionA" maxlength="200"></label>
          <label>选项 B<input type="text" name="optionB" maxlength="200"></label>
          <label>选项 C<input type="text" name="optionC" maxlength="200"></label>
          <label>选项 D<input type="text" name="optionD" maxlength="200"></label>
        </div>
      </div>

      <label>正确答案
        <input type="text" name="answer" required maxlength="16" style="max-width:220px">
      </label>
      <p class="hint" id="answer-hint">单选题答案形如：A</p>

      <div>
        <button type="submit">保存</button>
        <button type="button" class="btn ghost" onclick="resetQuestionForm()">清空</button>
      </div>
      <p id="question-tip" class="tip"></p>
    </form>

    <datalist id="subject-options">
      <option th:each="s : ${subjects}" th:value="${s}"></option>
    </datalist>
  </div>

  <!-- ------------------------------ 列表 ------------------------------ -->
  <table class="wrapped">
    <thead>
    <tr>
      <th>编号</th>
      <th>题型</th>
      <th>科目 / 知识点</th>
      <th>题干</th>
      <th>选项</th>
      <th>答案</th>
      <th>分值</th>
      <th>难度</th>
      <th>出题人</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${page.list.isEmpty()}">
      <td colspan="10" class="muted">还没有题目，先在上方表单里新增一道吧。</td>
    </tr>
    <tr th:each="q : ${page.list}">
      <td th:text="${q.id}">1</td>
      <td><span class="tag blue" th:text="${q.typeText}">单选题</span></td>
      <td>
        <div th:text="${q.subject}">科目</div>
        <div class="muted" th:text="${q.knowledgePoint}">知识点</div>
      </td>
      <td th:text="${q.content}">题干</td>
      <td class="muted">
        <div th:if="${q.optionA}" th:text="|A. ${q.optionA}|"></div>
        <div th:if="${q.optionB}" th:text="|B. ${q.optionB}|"></div>
        <div th:if="${q.optionC}" th:text="|C. ${q.optionC}|"></div>
        <div th:if="${q.optionD}" th:text="|D. ${q.optionD}|"></div>
        <span th:if="${q.judge}">判断题无需选项</span>
      </td>
      <td><b th:text="${q.answer}">A</b></td>
      <td th:text="${q.score}">5.0</td>
      <td><span class="tag" th:text="${q.difficultyText}">中等</span></td>
      <td class="muted" th:text="${q.creatorNickname}">王老师</td>
      <td class="nowrap">
        <button type="button" class="btn sm ghost" th:attr="onclick='editQuestion(' + ${q.id} + ')'">编辑</button>
        <button type="button" class="btn sm danger" th:attr="onclick='deleteQuestion(' + ${q.id} + ')'">删除</button>
      </td>
    </tr>
    </tbody>
  </table>

  <div class="pager">
    <a th:if="${page.pageNum > 1}"
       th:href="@{/teacher/questions(pageNum=${page.pageNum - 1}, keyword=${query.keyword}, subject=${query.subject}, type=${query.type}, difficulty=${query.difficulty}, sortBy=${query.sortBy}, sortDir=${query.sortDir})}">上一页</a>
    <span class="current" th:text="|第 ${page.pageNum} / ${page.pages} 页|">第 1 / 1 页</span>
    <a th:if="${page.pageNum < page.pages}"
       th:href="@{/teacher/questions(pageNum=${page.pageNum + 1}, keyword=${query.keyword}, subject=${query.subject}, type=${query.type}, difficulty=${query.difficulty}, sortBy=${query.sortBy}, sortDir=${query.sortDir})}">下一页</a>
    <span class="muted" th:text="|每页 ${page.pageSize} 条，共 ${page.total} 条|"></span>
  </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
