<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>成绩单与错题回顾 - 在线考试 / 题库系统</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/common :: topbar(${user})}"></header>

<main class="container">
  <div class="page-head">
    <h1 th:text="${record.paperTitle}">试卷标题</h1>
    <a class="btn ghost" th:href="@{/student/scores}">返回我的成绩</a>
  </div>

  <!-- ------------------------------ 成绩概览 ------------------------------ -->
  <div class="score-hero">
    <div class="stats" style="margin-bottom:0">
      <div class="stat" style="border:none;padding-left:0">
        <div class="label">本次得分</div>
        <div class="big" th:classappend="${record.passed} ? 'pass' : 'fail'"
             th:text="${record.score}">0</div>
        <div class="muted" th:text="|满分 ${record.paperTotalScore} 分 · 及格线 ${record.passScore} 分|">满分</div>
      </div>
      <div class="stat">
        <div class="label">结果</div>
        <div class="value" th:classappend="${record.passed} ? 'green' : 'red'"
             th:text="${record.passed} ? '及格' : '不及格'">结果</div>
        <div class="muted" th:if="${record.timeout}">
          <span class="tag red">超时交卷</span>
        </div>
      </div>
      <div class="stat">
        <div class="label">答对题数</div>
        <div class="value" th:text="|${record.correctCount} / ${record.totalCount}|">0 / 0</div>
      </div>
      <div class="stat">
        <div class="label">得分率</div>
        <div class="value" th:text="|${record.scorePercent}%|">0%</div>
      </div>
      <div class="stat">
        <div class="label">交卷时间</div>
        <div class="value" style="font-size:15px"
             th:text="${record.submitTime != null} ? ${#dates.format(record.submitTime, 'yyyy-MM-dd HH:mm')} : '—'">时间</div>
        <div class="muted" th:text="|开考 ${#dates.format(record.startTime, 'MM-dd HH:mm')}|">开考</div>
      </div>
    </div>
  </div>

  <!-- ------------------------------ 错题回顾 ------------------------------ -->
  <h2>错题回顾</h2>
  <p class="hint">
    判分时会把正确答案快照写入答卷，因此即使教师之后修改了题库，
    这里的回顾内容依旧与考试当天一致。多选题执行「全对才得分」，少选同样计入错题。
  </p>

  <div class="card" th:if="${wrongs.isEmpty()}">
    全部答对，没有错题 🎉
  </div>

  <div class="question" th:each="w : ${wrongs}">
    <div class="q-head">
      <span class="tag blue" th:text="${w.typeText}">题型</span>
      <span class="tag red" th:text="|得 0 / ${w.score} 分|">得分</span>
      <span class="muted" th:if="${w.knowledgePoint}" th:text="${w.knowledgePoint}">知识点</span>
      <span class="q-content" th:text="${w.content}">题干</span>
    </div>
    <div class="answer-line">
      你的作答：<b th:text="${w.studentAnswerText}">未作答</b>
      &nbsp;|&nbsp;
      正确答案：<b th:text="${w.correctAnswer}">正确答案</b>
    </div>
    <div class="muted" th:if="${w.optionA}" th:text="|A. ${w.optionA}|"></div>
    <div class="muted" th:if="${w.optionB}" th:text="|B. ${w.optionB}|"></div>
    <div class="muted" th:if="${w.optionC}" th:text="|C. ${w.optionC}|"></div>
    <div class="muted" th:if="${w.optionD}" th:text="|D. ${w.optionD}|"></div>
  </div>

  <!-- ------------------------------ 完整答卷 ------------------------------ -->
  <h2 style="margin-top:24px">完整答卷</h2>
  <div class="card">
    <div class="answer-item" th:each="a : ${answers}"
         th:classappend="${a.correct} ? 'correct' : 'wrong'">
      <div>
        <span class="tag" th:classappend="${a.correct} ? 'green' : 'red'"
              th:text="${a.correct} ? '答对' : '答错'">对错</span>
        <span class="tag blue" th:text="${a.typeText}">题型</span>
        <span class="muted" th:text="|得分 ${a.earnedScore} / ${a.score}|">得分</span>
      </div>
      <div style="margin-top:6px" th:text="${a.content}">题干</div>
      <div class="answer-line">
        你的作答：<b th:text="${a.studentAnswerText}">未作答</b>
        &nbsp;|&nbsp;
        正确答案：<b th:text="${a.correctAnswer}">正确答案</b>
      </div>
    </div>
    <p class="muted" th:if="${answers.isEmpty()}">没有答卷明细。</p>
  </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
