<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>在线答题 - 在线考试 / 题库系统</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!--
  答题页：题目由 Thymeleaf 服务端渲染（刷新不丢题），
  倒计时与交卷交给 js/app.js，通过 data-* 属性把 recordId 与截止时间戳传下去。
-->
<div id="exam-app"
     th:attr="data-record-id=${record.id}, data-deadline=${record.deadlineMillis}"></div>

<header th:replace="~{fragments/common :: topbar(${user})}"></header>

<main class="container">
  <div class="page-head">
    <h1 th:text="${record.paperTitle}">试卷标题</h1>
    <span class="muted">
      <span th:text="|总分 ${record.paperTotalScore} 分|">总分</span> ·
      <span th:text="|及格 ${record.passScore} 分|">及格分</span> ·
      <span th:text="|共 ${record.totalCount} 题|">题数</span>
    </span>
  </div>

  <div class="countdown-bar" id="countdown-bar">
    <div>
      剩余时间：<span id="countdown">--:--:--</span>
      <span class="muted" th:text="|（考试时长 ${record.durationMinutes} 分钟，到点自动交卷）|"></span>
    </div>
    <div>
      已作答 <b id="answered-count">0</b> / <span th:text="${record.totalCount}">0</span> 题
    </div>
  </div>

  <div id="question-list">
    <div class="question" th:each="q : ${questions}"
         th:attr="data-question-id=${q.questionId}, data-type=${q.type}">
      <div class="q-head">
        <span class="q-no" th:text="|第 ${q.sortOrder} 题|">第 1 题</span>
        <span class="tag blue" th:text="${q.typeText}">单选题</span>
        <span class="tag" th:text="|${q.score} 分|">10 分</span>
        <span class="muted" th:if="${q.knowledgePoint}" th:text="${q.knowledgePoint}">知识点</span>
        <span class="q-content" th:text="${q.content}">题干</span>
      </div>

      <!-- 单选题：radio -->
      <th:block th:if="${q.type == 'SINGLE'}">
        <label class="option" th:if="${q.optionA}">
          <input type="radio" th:name="|answer-${q.questionId}|" value="A">
          <span><span class="opt-key">A.</span> <span th:text="${q.optionA}">选项</span></span>
        </label>
        <label class="option" th:if="${q.optionB}">
          <input type="radio" th:name="|answer-${q.questionId}|" value="B">
          <span><span class="opt-key">B.</span> <span th:text="${q.optionB}">选项</span></span>
        </label>
        <label class="option" th:if="${q.optionC}">
          <input type="radio" th:name="|answer-${q.questionId}|" value="C">
          <span><span class="opt-key">C.</span> <span th:text="${q.optionC}">选项</span></span>
        </label>
        <label class="option" th:if="${q.optionD}">
          <input type="radio" th:name="|answer-${q.questionId}|" value="D">
          <span><span class="opt-key">D.</span> <span th:text="${q.optionD}">选项</span></span>
        </label>
      </th:block>

      <!-- 多选题：checkbox，全对才得分 -->
      <th:block th:if="${q.type == 'MULTIPLE'}">
        <p class="hint">多选题：少选、多选、错选均不得分，请选全再提交。</p>
        <label class="option" th:if="${q.optionA}">
          <input type="checkbox" th:name="|answer-${q.questionId}|" value="A">
          <span><span class="opt-key">A.</span> <span th:text="${q.optionA}">选项</span></span>
        </label>
        <label class="option" th:if="${q.optionB}">
          <input type="checkbox" th:name="|answer-${q.questionId}|" value="B">
          <span><span class="opt-key">B.</span> <span th:text="${q.optionB}">选项</span></span>
        </label>
        <label class="option" th:if="${q.optionC}">
          <input type="checkbox" th:name="|answer-${q.questionId}|" value="C">
          <span><span class="opt-key">C.</span> <span th:text="${q.optionC}">选项</span></span>
        </label>
        <label class="option" th:if="${q.optionD}">
          <input type="checkbox" th:name="|answer-${q.questionId}|" value="D">
          <span><span class="opt-key">D.</span> <span th:text="${q.optionD}">选项</span></span>
        </label>
      </th:block>

      <!-- 判断题：固定「正确 / 错误」两个选项 -->
      <th:block th:if="${q.type == 'JUDGE'}">
        <label class="option">
          <input type="radio" th:name="|answer-${q.questionId}|" value="A">
          <span><span class="opt-key">A.</span> 正确</span>
        </label>
        <label class="option">
          <input type="radio" th:name="|answer-${q.questionId}|" value="B">
          <span><span class="opt-key">B.</span> 错误</span>
        </label>
      </th:block>
    </div>
  </div>

  <div class="card">
    <button type="button" id="submit-btn">交卷</button>
    <span class="muted">交卷后立即自动判分，不能再修改答案。</span>
    <p id="tip" class="tip"></p>
  </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
