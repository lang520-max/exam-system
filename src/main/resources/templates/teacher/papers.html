<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>试卷管理 - 在线考试 / 题库系统</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/common :: topbar(${user})}"></header>

<main class="container">
  <div class="page-head">
    <h1>试卷管理</h1>
    <div>
      <a class="btn" th:href="@{/teacher/paper/new}">去组卷</a>
      <a class="btn ghost" th:href="@{/teacher/scores}">成绩统计</a>
    </div>
  </div>

  <div class="card">
    <div class="filters">
      <a class="btn sm" th:classappend="${status == null} ? 'btn' : 'btn ghost'" th:href="@{/teacher/papers}">全部</a>
      <a class="btn sm ghost" th:href="@{/teacher/papers(status='DRAFT')}">草稿</a>
      <a class="btn sm ghost" th:href="@{/teacher/papers(status='PUBLISHED')}">已发布</a>
      <a class="btn sm ghost" th:href="@{/teacher/papers(status='CLOSED')}">已结束</a>
    </div>
    <p class="hint" style="margin-top:10px">
      试卷默认是<b>草稿</b>状态，只有「已发布」后学生端才能看到并参加考试；
      「结束」后不再接受新的开考，但历史成绩与答卷全部保留。
    </p>
  </div>

  <table class="wrapped">
    <thead>
    <tr>
      <th>编号</th>
      <th>标题</th>
      <th>科目</th>
      <th>题数</th>
      <th>总分</th>
      <th>及格分</th>
      <th>时长</th>
      <th>状态</th>
      <th>组卷人</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${page.list.isEmpty()}">
      <td colspan="10" class="muted">还没有试卷，点右上角「去组卷」创建一份。</td>
    </tr>
    <tr th:each="p : ${page.list}">
      <td th:text="${p.id}">1</td>
      <td><b th:text="${p.title}">试卷标题</b></td>
      <td th:text="${p.subject}">科目</td>
      <td th:text="${p.questionCount}">8</td>
      <td th:text="${p.totalScore}">100.0</td>
      <td th:text="${p.passScore}">60.0</td>
      <td th:text="|${p.durationMinutes} 分钟|">60 分钟</td>
      <td>
        <span class="tag" th:classappend="${p.status == 'PUBLISHED'} ? 'green' : (${p.status == 'CLOSED'} ? 'red' : 'amber')"
              th:text="${p.statusText}">草稿</span>
      </td>
      <td class="muted" th:text="${p.creatorNickname}">王老师</td>
      <td class="nowrap">
        <a class="btn sm ghost" th:href="@{/teacher/scores(paperId=${p.id})}">成绩</a>
        <button type="button" class="btn sm ghost" th:if="${p.status == 'DRAFT'}"
                th:attr="onclick='publishPaper(' + ${p.id} + ')'">发布</button>
        <button type="button" class="btn sm ghost" th:if="${p.status == 'PUBLISHED'}"
                th:attr="onclick='closePaper(' + ${p.id} + ')'">结束</button>
        <button type="button" class="btn sm danger" th:if="${p.status == 'DRAFT'}"
                th:attr="onclick='deletePaper(' + ${p.id} + ')'">删除</button>
      </td>
    </tr>
    </tbody>
  </table>

  <div class="pager">
    <a th:if="${page.pageNum > 1}" th:href="@{/teacher/papers(pageNum=${page.pageNum - 1}, status=${status})}">上一页</a>
    <span class="current" th:text="|第 ${page.pageNum} / ${page.pages} 页|">第 1 / 1 页</span>
    <a th:if="${page.pageNum < page.pages}" th:href="@{/teacher/papers(pageNum=${page.pageNum + 1}, status=${status})}">下一页</a>
    <span class="muted" th:text="|共 ${page.total} 份试卷|"></span>
  </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
