# Nginx 反向代理配置
# 前端静态资源 + API 反向代理 + WebSocket 代理

upstream exam_backend {
    server app:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    # 日志
    access_log /var/log/nginx/exam_access.log;
    error_log /var/log/nginx/exam_error.log;

    # API 反向代理
    location /api/ {
        proxy_pass http://exam_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket 代理（考试倒计时推送）
    location /ws/ {
        proxy_pass http://exam_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;  # WebSocket 长连接
    }

    # 静态资源
    location / {
        proxy_pass http://exam_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查
    # 指向 actuator 的 /actuator/health，而不是需要鉴权的 /api/auth/me
    # （后者无 token 恒返回 401，这个健康检查端点等于没有）
    location /health {
        proxy_pass http://exam_backend/actuator/health;
        proxy_set_header Host $host;
    }
}