# ============================================================
#  测试档配置
#  - H2 内存库（MODE=MySQL），每个测试类拿到干净的库
#  - Redis / RabbitMQ 关闭：判分走 GradingEngine 同步路径，
#    幂等走数据库条件更新，测试不依赖任何中间件
# ============================================================
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:exam_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql
      encoding: UTF-8

  h2:
    console:
      enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.exam.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: test-only-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  access-expire: 1800000
  refresh-expire: 604800000

app:
  redis:
    enabled: false
  rabbitmq:
    enabled: false
  # 测试档关闭 WebSocket：ServerEndpointExporter 需要真实 Servlet 容器，
  # 而 @SpringBootTest 用的是 mock web 环境
  websocket:
    enabled: false
  exam:
    # 关闭超时清理定时任务。
    # 否则测试刚开考、还没走到交卷断言，定时任务就可能把记录扫成「超时」，
    # 造成随机失败——这类「跟时钟赛跑」的不稳定测试极难排查。
    scheduling-enabled: false

logging:
  level:
    com.exam: warn
    org.springframework: warn
