<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>可参加的考试 - 在线考试 / 题库系统</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/common :: topbar(${user})}"></header>

<main class="container">
  <div class="page-head">
    <h1>可参加的考试</h1>
    <a class="btn ghost" th:href="@{/student/scores}">我的成绩</a>
  </div>
  <p class="hint">
    考试开始后计时不可暂停；中途关掉页面不会重置时间，重新进入会接着上次的进度继续答题。
    倒计时结束会自动交卷，并在成绩单上标记为「超时」。
  </p>

  <div class="exam-list" th:if="${!page.list.isEmpty()}">
    <div class="exam-item" th:each="p : ${page.list}">
      <div>
        <div class="title" th:text="${p.title}">试卷标题</div>
        <div class="meta">
          <span th:text="|科目：${p.subject}|">科目</span> ·
          <span th:text="|${p.questionCount} 题|">8 题</span> ·
          <span th:text="|总分 ${p.totalScore} 分|">总分</span> ·
          <span th:text="|及格 ${p.passScore} 分|">及格分</span> ·
          <span th:text="|时长 ${p.durationMinutes} 分钟|">时长</span> ·
          <span th:text="|出题：${p.creatorNickname}|">出题人</span>
        </div>
      </div>
      <div class="nowrap">
        <!-- 没考过：开始考试 -->
        <button type="button" class="btn" th:if="${p.recordId == null}"
                th:attr="onclick='startExam(' + ${p.id} + ')'">开始考试</button>
        <!-- 考过但没交卷：继续答题 -->
        <th:block th:if="${p.recordId != null and p.recordStatus == 'ONGOING'}">
          <span class="tag amber">答题中</span>
          <a class="btn" th:href="@{/student/exam(recordId=${p.recordId})}">继续答题</a>
        </th:block>
        <!-- 已交卷：看成绩 -->
        <th:block th:if="${p.recordStatus == 'SUBMITTED'}">
          <span class="tag green" th:text="|已交卷 ${p.recordScore} 分|">已交卷</span>
          <a class="btn ghost" th:href="@{/student/review(recordId=${p.recordId})}">查看成绩单</a>
        </th:block>
      </div>
    </div>
  </div>

  <div class="card muted" th:if="${page.list.isEmpty()}">
    暂时没有已发布的考试。等教师发布试卷后，这里就会出现可参加的考试。
  </div>

  <div class="pager">
    <a th:if="${page.pageNum > 1}" th:href="@{/student/exams(pageNum=${page.pageNum - 1})}">上一页</a>
    <span class="current" th:text="|第 ${page.pageNum} / ${page.pages} 页|">第 1 / 1 页</span>
    <a th:if="${page.pageNum < page.pages}" th:href="@{/student/exams(pageNum=${page.pageNum + 1})}">下一页</a>
    <span class="muted" th:text="|共 ${page.total} 场考试|"></span>
  </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
